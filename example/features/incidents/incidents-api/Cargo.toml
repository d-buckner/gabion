[package]
name = "incidents-api"
version.workspace = true
edition.workspace = true
# v0.1 ships as a git/path dependency; not published to crates.io yet.
publish = false
license.workspace = true
authors.workspace = true
description = "incidents feature contract: wire types + #[service] trait. Compiles everywhere."

[features]
default = []
server = ["dep:axum", "dep:bytes"]
cli = ["dep:clap"]
# The document describes the routes the `server` feature serves, so it cannot be
# built without them: a contract cannot describe a route that is not there.
openapi = ["server"]

[dependencies]
gabion = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
# An incident names the watch it belongs to, and that id is `checks`' type. The
# dependency runs api -> api, which is the only direction a feature may reach a
# neighbour: no core, no implementation detail comes with it.
checks-api = { path = "../../checks/checks-api" }
axum = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
clap = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "openapi_snapshot"
required-features = ["openapi"]

# These five are used only inside expansion — the code `#[service]` generates
# (axum handlers, clap args, serde wire types) and the `JsonSchema` derive — so
# cargo-shear cannot see them. This is the tool's documented escape hatch rather
# than a deleted wall.
[package.metadata.cargo-shear]
ignored = ["serde", "axum", "bytes", "clap", "schemars"]

[lints]
workspace = true
