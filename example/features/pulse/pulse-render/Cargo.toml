[package]
name = "pulse-render"
version.workspace = true
edition.workspace = true
# v0.1 ships as a git/path dependency; not published to crates.io yet.
publish = false
license.workspace = true
authors.workspace = true
description = "pulse status UI. Depends on the two api crates and the shared kit ONLY — no core is in [dependencies], so importing core internals is unrepresentable."

[dependencies]
# Design tokens and the shared panel states. A `*-shared` crate may use the
# framework and third-party crates, never a feature's contract.
ui-shared = { path = "../../../shared/ui-shared" }
checks-api = { path = "../../checks/checks-api" }
incidents-api = { path = "../../incidents/incidents-api" }
# The runtime, for the types a screen carries: `Ctx` travels with the injected
# handle so every call the UI makes is identified. No core, still.
gabion = { workspace = true }
# Dioxus core + signals only — NO renderer feature here. The host picks the
# renderer, so this crate stays dual-target native + wasm.
dioxus = { workspace = true, default-features = false, features = ["macro", "html", "signals", "hooks"] }

[dev-dependencies]
# The panel snapshot renders the published component to HTML.
dioxus-ssr = "0.7"

[lints]
workspace = true
