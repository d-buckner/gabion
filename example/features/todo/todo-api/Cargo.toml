[package]
name = "todo-api"
version.workspace = true
edition.workspace = true
# v0.1 ships as a git/path dependency; not published to crates.io yet.
publish = false
license.workspace = true
authors.workspace = true
description = "todo feature contract: wire types + #[service] trait. Compiles everywhere."

[features]
# The typed client: the service trait implemented over `Http`, so a renderer can
# be handed a remote impl instead of an in-process one and cannot tell the
# difference. On by default — a contract with no client is a contract a wasm
# renderer cannot call.
default = ["client", "registry"]
client = []
server = ["dep:axum", "dep:bytes"]
cli = ["dep:clap"]
# The MCP surface: JSON-RPC tool definitions and the dispatch behind them. The
# schema comes from `schemars`, which the wire types already derive.
mcp = []
# The document describes the routes the `server` feature serves, so it cannot be
# built without them: a contract cannot describe a route that is not there.
openapi = ["server"]
# The generated agreement suite drives one impl through every adapter, which
# means all of them have to be compiled.
conformance = ["server", "cli", "mcp", "client"]
# Automatic registration: `mount_on` on the trait object, so a host mounts an
# impl and gets this contract's routes, subcommand and tools with it. No linker
# tricks, and it works on wasm — see `gabion::registry`.
registry = []

[dependencies]
gabion = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
axum = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
clap = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }

# The generated CLI module only exists with the `cli` feature, so the test that
# drives it is built only then. `gabion check` runs `cargo test --all-features`,
# which is what makes that skip impossible in the gate.
[[test]]
name = "cli_surface"
required-features = ["cli"]

[[test]]
name = "mcp"
required-features = ["mcp"]

[[test]]
name = "registry"
required-features = ["registry"]

[[test]]
name = "openapi_snapshot"
required-features = ["openapi"]

[[test]]
name = "client"
required-features = ["client"]

# These five are used only inside expansion — the code `#[service]` generates
# (axum handlers, clap args, serde wire types) and the `JsonSchema` derive — so
# cargo-shear cannot see them. This is the tool's documented escape hatch rather
# than a deleted wall.
[package.metadata.cargo-shear]
ignored = ["serde", "axum", "bytes", "clap", "schemars"]

[lints]
workspace = true
