[package]
name = "todo-render"
version.workspace = true
edition.workspace = true
# v0.1 ships as a git/path dependency; not published to crates.io yet.
publish = false
license.workspace = true
authors.workspace = true
description = "todo UI. Depends on todo-api and the shared kit ONLY — todo-core is not in [dependencies], so importing core internals is unrepresentable."

[dependencies]
# Design tokens and the shared panel states. A `*-shared` crate may use the
# framework and third-party crates, never a feature's contract.
ui-shared = { path = "../../../shared/ui-shared" }
todo-api = { path = "../todo-api" }
# The runtime, for the types a screen carries: `Ctx` travels with the injected
# handle so every call the UI makes is identified. No core, still.
gabion = { workspace = true }
# Dioxus core + signals only — NO renderer feature here. The host picks the
# renderer (desktop/web), so this crate stays dual-target native + wasm.
dioxus = { workspace = true, default-features = false, features = ["macro", "html", "signals", "hooks"] }
# NOTE: no todo-core here. That is the wall. The host injects the impl.

[dev-dependencies]
dioxus-ssr = "0.7"
# The snapshot test drives the published view with a fixture impl of the contract,
# which is the only way to render a list without reaching into todo-core.
tokio = { workspace = true }

[lints]
workspace = true
