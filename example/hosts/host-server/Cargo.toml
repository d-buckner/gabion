[package]
name = "host-server"
version.workspace = true
edition.workspace = true
# v0.1 ships as a git/path dependency; not published to crates.io yet.
publish = false
license.workspace = true
authors.workspace = true
description = "Server host: axum router generated by #[service]. Composition only."

[[bin]]
name = "myapp-server"
path = "src/main.rs"

[dependencies]
gabion-native = { workspace = true }
todo-api = { path = "../../features/todo/todo-api", features = ["server", "cli"] }
todo-core = { path = "../../features/todo/todo-core" }
axum = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
gabion = { workspace = true }
# Test-build only: the agreement suite drives all four adapters, and the server
# binary itself should not carry clap to do it.
todo-api = { path = "../../features/todo/todo-api", features = ["conformance"] }
serde_json = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
