[package]
name = "host-pulse-cli"
version.workspace = true
edition.workspace = true
# v0.1 ships as a git/path dependency; not published to crates.io yet.
publish = false
license.workspace = true
authors.workspace = true
description = "pulse CLI host: two generated clap trees, one exit-code mapping. Composition only."

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
gabion = { workspace = true }
gabion-native = { workspace = true }
checks-api = { path = "../../features/checks/checks-api", features = ["cli"] }
incidents-api = { path = "../../features/incidents/incidents-api", features = ["cli"] }
checks-core = { path = "../../features/checks/checks-core" }
incidents-core = { path = "../../features/incidents/incidents-core" }
clap = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
