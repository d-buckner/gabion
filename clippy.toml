# gabion effect ban — the wasm-trap class.
#
# Why this file exists at all: `std::fs` / `std::net` / `std::thread::spawn` do
# not exist on wasm32-unknown-unknown, so the compile target seals them for
# free. But `std::time`, `std::env`, `std::process::id` DO compile on wasm and
# only trap at runtime — the target does not catch those, this list does.
#
# Verified by `gabion check` (and re-verified by the probes in
# crates/gabion-check/tests/): before this list was extended,
# `std::thread::spawn`, `std::env::var` and `std::process::id` all compiled for
# wasm32 AND passed clippy. That was the hole.
#
# The ban is GLOBAL on purpose: it also fires in hosts and in gabion-native,
# which are the designated effect homes. Those crates opt out with an explicit
# crate-level `#![allow(clippy::disallowed_types, clippy::disallowed_methods)]`,
# and `gabion check` fails if such an allow appears anywhere that is not a
# declared effect home. The escape hatch is visible and audited, not silent.
#
# (App workspaces generated by `gabion new` ship their own copy of this file;
# `gabion check` audits that the required entries below are still present.)

# --- size and complexity gates (uniform across every crate class) ---
# The shortcut these seal: a 200-line match instead of a named function.
# `gabion check` audits that these keys stay at or below these values.
#
# NOTE: clippy's own `too_many_branches` is hardcoded at 42 branches, is not
# configurable, and is not even a known lint name on this toolchain — so the
# real branch gate (max-branches, default 10) lives in `gabion check` as the
# `too-many-branches` rule, counted from the syn AST.
cognitive-complexity-threshold = 15
too-many-lines-threshold = 80
too-many-arguments-threshold = 6
type-complexity-threshold = 150

disallowed-types = [
    # --- time: compiles on wasm, traps at runtime ---
    { path = "std::time::SystemTime", reason = "core is runtime-free: use Caps::Clock" },
    { path = "std::time::Instant", reason = "core is runtime-free: use Caps::Clock" },
    # --- threads: compiles on wasm, panics at runtime ---
    { path = "std::thread::JoinHandle", reason = "core is runtime-free: no threads on wasm" },
    { path = "std::thread::Thread", reason = "core is runtime-free: no threads on wasm" },
    # --- filesystem: does not exist on wasm ---
    { path = "std::fs::File", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::DirEntry", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::Metadata", reason = "core is runtime-free: use Caps::Store" },
    # --- network: does not exist on wasm ---
    { path = "std::net::TcpStream", reason = "core is runtime-free: use an Http capability" },
    { path = "std::net::TcpListener", reason = "core is runtime-free: hosts only" },
    { path = "std::net::UdpSocket", reason = "core is runtime-free: hosts only" },
]

disallowed-methods = [
    # --- time ---
    { path = "std::time::SystemTime::now", reason = "core is runtime-free: use Caps::Clock" },
    { path = "std::time::Instant::now", reason = "core is runtime-free: use Caps::Clock" },
    # --- threads ---
    { path = "std::thread::sleep", reason = "core is runtime-free: use a Sleep capability" },
    { path = "std::thread::spawn", reason = "core is runtime-free: compiles on wasm, panics at runtime" },
    { path = "std::thread::park", reason = "core is runtime-free: no threads on wasm" },
    # --- environment: compiles on wasm, returns empty/traps ---
    { path = "std::env::var", reason = "core is runtime-free: config comes in via Caps, never the ambient env" },
    { path = "std::env::var_os", reason = "core is runtime-free: config comes in via Caps" },
    { path = "std::env::vars", reason = "core is runtime-free: config comes in via Caps" },
    { path = "std::env::vars_os", reason = "core is runtime-free: config comes in via Caps" },
    { path = "std::env::args", reason = "core is runtime-free: argv is the host's business" },
    { path = "std::env::args_os", reason = "core is runtime-free: argv is the host's business" },
    { path = "std::env::current_dir", reason = "core is runtime-free: paths are the host's business" },
    { path = "std::env::current_exe", reason = "core is runtime-free: paths are the host's business" },
    { path = "std::env::temp_dir", reason = "core is runtime-free: paths are the host's business" },
    { path = "std::env::set_var", reason = "core is runtime-free: mutating ambient env is a host effect" },
    { path = "std::env::remove_var", reason = "core is runtime-free: mutating ambient env is a host effect" },
    # --- process: id/abort trap or are meaningless on wasm ---
    { path = "std::process::id", reason = "core is runtime-free: no process on wasm" },
    { path = "std::process::abort", reason = "core is runtime-free: hosts only" },
    { path = "std::process::Command::new", reason = "core is runtime-free: spawning processes is a host effect" },
    # --- filesystem ---
    { path = "std::fs::read", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::read_to_string", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::read_dir", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::write", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::create_dir", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::create_dir_all", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::remove_file", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::remove_dir", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::remove_dir_all", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::metadata", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::rename", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::File::open", reason = "core is runtime-free: use Caps::Store" },
    { path = "std::fs::File::create", reason = "core is runtime-free: use Caps::Store" },
    # --- network ---
    { path = "std::net::TcpStream::connect", reason = "core is runtime-free: use an Http capability" },
    { path = "std::net::TcpListener::bind", reason = "core is runtime-free: hosts only" },
]
