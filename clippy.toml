# Framework dogfood: the effect ban for *-core crates.
# std::time COMPILES on wasm32 and panics only at runtime — the compile target
# alone does not seal the shortcut. This list + `disallowed_types = "deny"` does.
# (App workspaces generated by `fw new` ship their own copy of this file.)

disallowed-types = [
    { path = "std::time::SystemTime", reason = "core is runtime-free: use Caps::Clock" },
    { path = "std::time::Instant", reason = "core is runtime-free: use Caps::Clock" },
]
disallowed-methods = [
    { path = "std::thread::sleep", reason = "core is runtime-free: use a Sleep capability" },
]
