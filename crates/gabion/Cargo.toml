[package]
name = "gabion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Runtime-free core: capability traits, error model, client contracts for gabion apps."
keywords = ["framework", "webassembly", "capabilities", "services", "cross-platform"]
categories = ["asynchronous", "wasm", "rust-patterns"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
futures-core = { workspace = true }
gabion-macros = { workspace = true }

# Only for the test harness: the capability tests need an executor to drive the
# futures they assert on. Nothing in the library depends on a runtime. Native
# only, because tokio's `net` does not build for wasm32 and the wasm proof builds
# this crate's tests with `--all-targets`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
