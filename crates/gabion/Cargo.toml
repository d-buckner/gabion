[package]
name = "gabion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Runtime-free core: capability traits, error model, client contracts for gabion apps."
keywords = ["framework", "webassembly", "capabilities", "services", "cross-platform"]
categories = ["asynchronous", "wasm", "rust-patterns"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
