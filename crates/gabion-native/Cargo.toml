[package]
name = "gabion-native"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Native capability impls (SystemClock). Host-side only — never imported by *-core."
keywords = ["native", "capabilities", "tokio", "reqwest", "mcp"]
categories = ["asynchronous", "network-programming"]

[features]
default = []
# The MCP-over-HTTP transport needs a server, so it needs axum. A host that only
# serves stdio does not pay for it.
server = ["dep:axum"]

[dependencies]
gabion = { workspace = true }
serde_json = { workspace = true }
getrandom = "0.3"
tokio = { workspace = true, features = ["time"] }
reqwest = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
# test-util: the timer tests run on tokio's paused clock, so they check a
# real timer without spending wall time.
tokio = { workspace = true, features = ["time", "test-util"] }
tempfile = "3"

[lints]
workspace = true
