[package]
name = "gabion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "gabion check: one command, one exit code. Orchestrates clippy + fmt + cargo-shear + cargo-deny + wasm builds, and adds the three rules no existing linter can express."
keywords = ["cli", "linter", "codegen", "ci", "scaffolding"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gabion"
path = "src/main.rs"

[lib]
name = "gabion_cli"
path = "src/lib.rs"

[dependencies]
serde_json = { workspace = true }
toml = "0.8"
# span-locations: line/column from syn spans on stable. rustc_lexer: the real
# rustc tokenizer, so comments/strings/lifetimes are told apart exactly.
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["visit"] }
# Rendering a signature for the lock hash: `TokenStream::to_string()` is stable
# and carries no spans, unlike Debug.
quote = { workspace = true }
rustc_lexer = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
