name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  # One command, one exit code: `gabion check` green == architecture correct.
  # Nothing here is a standard a reviewer has to remember.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install gate tools
        run: cargo install cargo-shear cargo-deny --locked

      - name: gabion check
        run: cargo run -p gabion-cli -- check
