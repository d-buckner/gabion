[workspace]
resolver = "2"
members = [
    "crates/gabion",
    "crates/gabion-cli",
    "crates/gabion-macros",
    "crates/gabion-native",
    "crates/gabion-web",
    "example/features/todo/todo-api",
    "example/features/todo/todo-core",
    "example/features/todo/todo-render",
    "example/features/checks/checks-api",
    "example/features/checks/checks-core",
    "example/features/incidents/incidents-api",
    "example/features/incidents/incidents-core",
    "example/features/pulse/pulse-render",
    "example/shared/ui-shared",
    "example/hosts/host-native",
    "example/hosts/host-pulse-cli",
    "example/hosts/host-pulse-native",
    "example/hosts/host-pulse-server",
    "example/hosts/host-pulse-web",
    "example/hosts/host-server",
    "example/hosts/host-web",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["Daniel Buckner"]
# Inherited by the five published crates. An inherited path is resolved
# relative to the *workspace* manifest, so "README.md" (not "../../README.md")
# is what lands in each crate. No `homepage`: it would duplicate repository, and
# cargo warns `redundant_homepage`. Without repository, `cargo package` warns
# "manifest has no documentation, homepage or repository".
repository = "https://github.com/d-buckner/gabion"
readme = "README.md"

# gabion's own gate configuration. `gabion check` reads this; `gabion new`
# generates the same block into every app it scaffolds.
[workspace.metadata.gabion]
# The gabion runtime itself: never allowed to depend on a feature crate.
framework-crates = ["gabion", "gabion-macros", "gabion-native", "gabion-web", "gabion-cli"]
# gabion-cli is a dev tool: it spawns processes and reads env by definition,
# so it is a declared effect home and `gabion check` audits that fact.
effect-homes = ["gabion-cli"]
max-file-lines = 400
max-branches = 10

# Allowed edges. Anything not listed here fails the `edge-table` rule.
[workspace.metadata.gabion.edges]
api = ["framework", "shared", "api"]
core = ["framework", "shared", "api"]
render = ["framework", "shared", "api"]
shared = ["framework"]
host = ["framework", "shared", "api", "core", "render"]
framework = ["framework"]
unclassified = []

[workspace.lints.rust]
# No unsafe anywhere in a gabion workspace, including the effect homes. Nothing
# in the runtime needs it; a crate that does must say why in review.
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Effect ban for *-core crates (see clippy.toml for the disallowed list).
# std::time compiles on wasm (it only panics at runtime), so the target alone
# does NOT catch it — this gate does. Apps re-declare it in their core crates.
disallowed_types = "deny"
disallowed_methods = "deny"

# Size and complexity gates (uniform thresholds, values in clippy.toml).
# The shortcut these seal: one 200-line match instead of a named function.
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"

[workspace.dependencies]
# `version` alongside `path` is what makes publishing possible: cargo drops the
# path when it writes the published manifest, and a path-only dependency has no
# requirement left to publish, so the uploaded crate cannot resolve. Locally the
# path still wins, so workspace development is unchanged.
# If a pre-release is ever published from these crates, the requirement has to
# name the pre-release too: semver excludes pre-releases from a bare `0.1`
# requirement, so gabion could not resolve gabion-macros 0.1.0-alpha.1.
gabion = { path = "crates/gabion", version = "0.1" }
gabion-macros = { path = "crates/gabion-macros", version = "0.1" }
gabion-native = { path = "crates/gabion-native", version = "0.1" }
gabion-web = { path = "crates/gabion-web", version = "0.1" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
axum = "0.8"
# `time` is not optional: gabion-native's `Sleep` capability is tokio::time.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# rustls only, so the native http capability keeps the single-binary promise:
# no system openssl, no system ca-certificate path to configure.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The native stream transport: one WebSocket per host (docs/streaming.md §5).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
clap = "4"
dioxus = { version = "0.7", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false }
console_error_panic_hook = "0.1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# The stream trait gabion names in a signature. No runtime, no unsafe in its own
# API, and it builds for wasm32-unknown-unknown.
futures-core = "0.3"
futures-util = "0.3"

# Debug info is ~76% of a dev-profile binary here. Line tables keep backtraces
# usable and drop about 90% of it.
[profile.dev]
debug = "line-tables-only"
